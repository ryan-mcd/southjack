name: Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/security.yml

  build:
    name: Build unsigned release APK
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate tag and determine Android version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/ci/release-version.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-34-ext12' 'build-tools;36.0.0'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-disabled: true

      - name: Build unsigned release
        env:
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          bash ./gradlew --no-daemon --stacktrace \
            :app:assembleRelease \
            "-PciVersionName=$RELEASE_VERSION_NAME" \
            "-PciVersionCode=$RELEASE_VERSION_CODE"

      - name: Verify generated APK metadata
        env:
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          assert metadata['applicationId'] == 'com.southjack.bridge', 'Unexpected release application ID'
          assert len(metadata['elements']) == 1, 'This workflow expects one universal APK'
          apk = metadata['elements'][0]
          assert apk['versionName'] == os.environ['RELEASE_VERSION_NAME'], 'Version name mismatch'
          assert apk['versionCode'] == int(os.environ['RELEASE_VERSION_CODE']), 'Version code mismatch'
          assert apk['outputFile'] == 'app-release-unsigned.apk', 'Expected unsigned release APK'
          print('Release metadata verified.')
          PY

      - name: Upload unsigned APK for isolated signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Sign and publish on a fresh runner
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out signing scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: Set up Android signing tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install pinned signing tools
        run: sdkmanager 'build-tools;36.0.0'

      - name: Download APK produced by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/release/

      - name: Sign and verify release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: bash scripts/ci/sign-apk.sh

      - name: Write build provenance and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          keys = ['GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT',
                  'RELEASE_TAG', 'RELEASE_VERSION_CODE']
          data = {key: os.environ[key] for key in keys}
          data['workflow_url'] = (f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          Path('dist/build-info.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
          cd dist
          sha256sum ./*.apk signing-certificate.txt build-info.json > SHA256SUMS.txt

      - name: Retain signed build even if publishing fails
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: southjack-release-${{ github.ref_name }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and attach files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.apk dist/SHA256SUMS.txt dist/signing-certificate.txt dist/build-info.json \
            --verify-tag --generate-notes --title "SouthJack $RELEASE_TAG"

name: Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  scan:
    name: Dependencies, secrets, and workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source and history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install checksum-pinned scanners
        run: |
          mkdir -p build/security
          python3 scripts/ci/install-security-tools.py

      - name: Scan Git history for secrets
        if: ${{ !cancelled() }}
        run: gitleaks git --redact --report-format json --report-path build/security/gitleaks.json .

      - name: Scan workflow security
        if: ${{ !cancelled() }}
        run: zizmor --offline --min-severity medium --format json .github/workflows > build/security/zizmor.json

      - name: Check Android privacy and permission policies
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_security.py

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-34-ext12' 'build-tools;36.0.0'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-disabled: true

      - name: Inventory dependencies and run Android lint
        run: >-
          bash ./gradlew --no-daemon --stacktrace
          -I scripts/ci/dependency-inventory.init.gradle
          securityInventory :app:lintDebug :app:lintRelease

      - name: Scan resolved runtime and build dependencies
        if: ${{ !cancelled() && hashFiles('build/security/dependencies.cdx.json') != '' }}
        run: >-
          osv-scanner scan source --no-resolve --all-packages
          -L build/security/dependencies.cdx.json
          --format=json --output-file=build/security/osv.json

      - name: Retain scan results and dependency inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/security/
            app/build/reports/
          if-no-files-found: warn
          retention-days: 30
